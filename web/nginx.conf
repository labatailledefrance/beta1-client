# Fichiers statiques du client. En production, TLS, limites et en-têtes de
# sécurité sont aussi posés par l'ingress Traefik (H-01, F-04).
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # Le wasm se compresse au cinquième (35 Mo → 7 Mo).
    gzip on;
    gzip_comp_level 6;
    gzip_types application/wasm application/javascript text/css;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' ws: wss:; style-src 'self' 'unsafe-inline'" always;

    # « expires » plutôt qu'add_header : un add_header dans un location
    # annulerait tous les en-têtes ci-dessus.
    location = /index.html { expires -1; }
    location = / { expires -1; }
}
